[defaults]
# Inventory file location
inventory           = hosts

# Roles search path
roles_path          = roles

# Disable host key checking for lab/Vagrant environments
host_key_checking   = False

# Default remote user (override per-play or per-host as needed)
remote_user         = vagrant

# Private key used for SSH connections
; private_key_file    = ~/.ssh/ansible

# Nicer output formatting
stdout_callback     = yaml
bin_ansible_callbacks = True

# Speed up connection by enabling SSH pipelining (requires requiretty disabled on target)
pipelining          = True

# Retry files are noisy; store them in /tmp or disable
retry_files_enabled = False

# Fact caching can speed up repeated runs (optional)
# fact_caching        = jsonfile
# fact_caching_connection = /tmp/ansible_facts_cache
# fact_caching_timeout    = 3600

[privilege_escalation]
become              = False
become_method       = sudo
become_user         = root
become_ask_pass     = False

[ssh_connection]
# Persist SSH connections across tasks for faster execution
ssh_args            = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
pipelining          = True
