---
# Ansible Galaxy collection requirements.
# Install with: ansible-galaxy collection install -r requirements.yml
#
# Collections used:
#   - ansible.posix   : authorized_key, firewalld, sysctl, etc.
#   - community.general : zypper, ufw, random_string lookup, etc.

collections:
  - name: ansible.posix
    version: ">=1.5.0"

  - name: community.general
    version: ">=8.0.0"
