---
# Role: update
# Upgrades all installed packages on the target system.
# Supports: Debian/Ubuntu, CentOS (yum), RHEL/OracleLinux/AlmaLinux (dnf), openSUSE/SLES

- name: Upgrade all packages (Debian / Ubuntu)
  ansible.builtin.apt:
    name: "*"
    state: latest
    update_cache: true
    force_apt_get: true
    autoclean: true
    autoremove: true
  become: true
  when: ansible_os_family == "Debian"

- name: Upgrade all packages (CentOS – yum)
  ansible.builtin.yum:
    name: "*"
    state: latest
  become: true
  when:
    - ansible_distribution == "CentOS"
    - ansible_distribution_major_version | int < 8

- name: Upgrade all packages (RHEL / OracleLinux / AlmaLinux / CentOS 8+)
  ansible.builtin.dnf:
    name: "*"
    state: latest
  become: true
  when: >
    ansible_distribution in ["OracleLinux", "RedHat", "AlmaLinux", "Rocky"] or
    (ansible_distribution == "CentOS" and ansible_distribution_major_version | int >= 8)

- name: Upgrade all packages (openSUSE / SLES)
  community.general.zypper:
    name: "*"
    state: latest
  become: true
  when: ansible_os_family == "Suse"
