d-i base-installer/kernel/override-image string linux-image-amd64
d-i keyboard-configuration/xkb-keymap select us
d-i time/zone string Europe/Warsaw
d-i clock-setup/ntp boolean true
d-i auto-install/enable boolean true
d-i debian-installer/locale string en_US.UTF-8
d-i debian-installer/add-kernel-opts string net.ifnames=0 biosdevname=0 systemd.unified_cgroup_hierarchy=1
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean false

# GRUB configuration
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

# APT and CD-ROM scan avoidance
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/use_mirror boolean true

# Partitioning
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman/mount_style select uuid
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-basicfilesystems/choose_label string gpt
d-i partman-basicfilesystems/default_label string gpt
d-i partman-partitioning/choose_label string gpt
d-i partman-partitioning/default_label string gpt
d-i partman/choose_label string gpt
d-i partman/default_label string gpt
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select scheme
d-i partman-auto/expert_recipe string \
    scheme :: \
    1 1 1 free \
        $gptonly{ } \
        $primary{ } \
        $bios_boot{ } \
        method{ biosgrub } \
    . \
    2048 0 2048 ext4 \
        $gptonly{ } \
        $primary{ } \
        $bootable{ } \
        method{ format } \
        format{ } \
        use_filesystem{ } \
        filesystem{ ext4 } \
        mountpoint{ /boot } \
    . \
    1 0 -1 ext4 \
        $gptonly{ } \
        $primary{ } \
        method{ format } \
        format{ } \
        use_filesystem{ } \
        filesystem{ ext4 } \
        mountpoint{ / } \
    .

# Users and Passwords
d-i passwd/root-login boolean true
d-i passwd/root-password password vagrant
d-i passwd/root-password-again password vagrant
d-i passwd/user-fullname string vagrant
d-i passwd/user-uid string 1000
d-i passwd/user-password password vagrant
d-i passwd/user-password-again password vagrant
d-i passwd/username string vagrant
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

# Network
d-i netcfg/get_hostname string debian
d-i netcfg/get_domain string localdomain

# Package Selection
d-i debconf/frontend select noninteractive
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/install-language-support boolean false
d-i pkgsel/language-packs multiselect en
d-i pkgsel/update-policy select none
d-i pkgsel/upgrade select full-upgrade
d-i pkgsel/updatedb boolean true
d-i pkgsel/include string \
    ca-certificates \
    cloud-guest-utils \
    cloud-init \
    curl \
    e2fsprogs \
    iproute2 \
    openssh-server \
    perl \
    python3 \
    rsync \
    sudo \
    gcc \
    hostname \
    locales \
    qemu-guest-agent \
    nfs-common

# Mirrors
d-i mirror/protocol string http
d-i mirror/http/proxy string
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian

# Late Command
d-i preseed/late_command string in-target /bin/bash -c ' \
    rm -rf /root/.bash_logout; \
    mkdir -p /root/.ssh; \
    chmod 0700 /root/.ssh; \
    echo "ssh-rsa  vagrant insecure public key" > /root/.ssh/authorized_keys; \
    chmod 0600 /root/.ssh/authorized_keys; \
    chown -Rf root:root /root; \
    groupadd -g 1000 vagrant; \
    useradd -g 1000 -u 1000 -d /home/vagrant -s /bin/bash -m vagrant; \
    usermod -aG sudo vagrant; \
    echo "vagrant:vagrant" | chpasswd; \
    rm -rf /home/vagrant/.bash_logout; \
    mkdir -p /home/vagrant/.ssh; \
    chmod 0700 /home/vagrant/.ssh; \
    echo "ssh-rsa  vagrant insecure public key" > /home/vagrant/.ssh/authorized_keys; \
    chmod 0600 /home/vagrant/.ssh/authorized_keys; \
    chown -Rf vagrant:vagrant /home/vagrant; \
    mkdir -p /etc/sudoers.d; \
    echo "vagrant ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/vagrant; \
    chmod 0440 /etc/sudoers.d/vagrant; \
    mkdir -p /etc/ssh/sshd_config.d; \
    printf "UseDNS no\nPubkeyAcceptedKeyTypes +ssh-rsa\nHostkeyAlgorithms +ssh-rsa\n" > /etc/ssh/sshd_config.d/vagrant.conf; \
    ssh-keygen -A; \
    systemctl enable ssh.service; \
    sed -i "s/^GRUB_DEFAULT=.*/GRUB_DEFAULT=\"0\"/g" /etc/default/grub; \
    sed -i "s/^GRUB_CMDLINE_LINUX=.*/GRUB_CMDLINE_LINUX=\"net.ifnames=0 biosdevname=0 systemd.unified_cgroup_hierarchy=1\"/g" /etc/default/grub; \
    sed -i "s/^GRUB_CMDLINE_LINUX_DEFAULT=.*/GRUB_CMDLINE_LINUX_DEFAULT=\"net.ifnames=0 biosdevname=0 systemd.unified_cgroup_hierarchy=1\"/g" /etc/default/grub; \
    update-grub; \
    update-initramfs -c -k all; \
    systemctl disable apt-daily.service apt-daily.timer apt-daily-upgrade.service apt-daily-upgrade.timer; \
    exit 0 \
'
