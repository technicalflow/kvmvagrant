# Installation source
url --url=https://mirror.stream.centos.org/10-stream/BaseOS/x86_64/os/
#repo --name=baseos --baseurl=https://mirror.stream.centos.org/10-stream/BaseOS/x86_64/os/
repo --name=appstream --baseurl=https://mirror.stream.centos.org/10-stream/AppStream/x86_64/os/
repo --name=crb --baseurl=https://mirror.stream.centos.org/10-stream/CRB/x86_64/os/

lang en_US.UTF-8
keyboard us
timezone Europe/Warsaw --utc

text

firstboot --disabled
firewall --disabled
selinux --permissive

network --device=link --bootproto=dhcp --activate --onboot=on --hostname=centos.localdomain

zerombr
clearpart --all --initlabel --disklabel=gpt
part biosboot --size=1 --fstype=biosboot
part /boot --size=2048 --fstype=ext4
# part swap --size=8192 --fstype=swap
part / --grow --fstype=ext4
bootloader --timeout=1 --append="net.ifnames=0 biosdevname=0 systemd.unified_cgroup_hierarchy=1"

services --enabled=sshd --disabled=cloud-init,cloud-init-local,cloud-config,cloud-final

rootpw --plaintext vagrant
user --name=vagrant --password=vagrant --plaintext --groups=wheel

reboot

%packages --excludedocs --ignoremissing
@core
-sssd
ca-certificates
cloud-init
cloud-utils-growpart
coreutils
curl
gcc
gnupg2
e2fsprogs
iproute
openssh-server
perl
python3
rsync
sudo
yum-utils
qemu-guest-agent
sequoia-sq
nfs-utils
rpcbind
nano
%end

%post --interpreter=/bin/bash
echo "root:vagrant" | chpasswd
rm -rf /root/.bash_logout
mkdir -p /root/.ssh
chmod 0700 /root/.ssh
echo "ssh-rsa  vagrant insecure public key" > /root/.ssh/authorized_keys
chmod 0600 /root/.ssh/authorized_keys
chown -Rf root:root /root
groupadd -g 1000 vagrant
useradd -g 1000 -u 1000 -d /home/vagrant -s /bin/bash -m vagrant
echo "vagrant:vagrant" | chpasswd
rm -rf /home/vagrant/.bash_logout
mkdir -p /home/vagrant/.ssh
chmod 0700 /home/vagrant/.ssh
echo "ssh-rsa  vagrant insecure public key" > /home/vagrant/.ssh/authorized_keys
chmod 0600 /home/vagrant/.ssh/authorized_keys
chown -Rf vagrant:vagrant /home/vagrant
mkdir -p /etc/sudoers.d
echo "vagrant ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/vagrant
chmod 0440 /etc/sudoers.d/vagrant
sed -i "s/^[#\s]*UseDNS.*$/UseDNS no/g" /etc/ssh/sshd_config
ssh-keygen -A
systemctl enable sshd.service

# Authselect minimal profile (since sssd is excluded)
authselect select minimal --force || true

exit 0
%end
